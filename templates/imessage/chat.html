<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatShorts renderer</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div id="canvas">
    <div id="screen">
      <div id="status"><span id="status-time">9:41</span><svg class="status-icons" viewBox="0 0 150 34" aria-hidden="true">
          <rect x="0" y="22" width="8" height="12" rx="2" fill="currentColor"/><rect x="12" y="16" width="8" height="18" rx="2" fill="currentColor"/><rect x="24" y="10" width="8" height="24" rx="2" fill="currentColor"/><rect x="36" y="2" width="8" height="32" rx="2" fill="currentColor"/>
          <rect x="62" y="6" width="34" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><rect x="66" y="10" width="22" height="14" rx="3" fill="currentColor"/>
          <rect x="100" y="12" width="4" height="10" rx="2" fill="currentColor"/>
                  </svg></div>
      <div id="header">
        <div id="header-back" aria-hidden="true">&#8249;</div>
        <div id="header-avatar"></div>
        <div id="header-title"></div>
      </div>
      <div id="viewport">
        <div id="content"></div>
      </div>
      <div id="input">
        <div id="input-plus" aria-hidden="true">+</div>
        <div id="input-field"><span>iMessage</span></div>
      </div>
    </div>
  </div>
  <!-- Measurement sandbox: same typography as bubbles, used by layout/measure-text.js -->
  <div id="measure" aria-hidden="true"></div>
  <script src="chat.js"></script>
</body>
</html>
